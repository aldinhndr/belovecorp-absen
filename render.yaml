services:
  - type: web
    name: belove-absen-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TZ
        value: Asia/Jakarta
      - key: PYTHON_VERSION
        value: 3.10.0
